name: CI

on:
  push:
    branches: [main, master]
    tags: ['**']
  pull_request:
    branches: [main, master]
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  go-check:
    uses: netresearch/.github/.github/workflows/go-check.yml@main
    with:
      enable-tool-build-cache: true
      enable-smoke-fast-feedback: true
      enable-fuzz: true
      enable-integration-tests: true
      enable-license-check: true
      enable-codecov: true
      coverage-threshold: 80.0
      # Under -race and atomic coverage the package's tests take 7 to 10
      # minutes on a hosted runner, so go test's default limit of 10 minutes
      # stops a slow run. The job limit stays 5 minutes above the test limit.
      test-flags: "-race -coverprofile=coverage.out -covermode=atomic -timeout=20m"
      timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
